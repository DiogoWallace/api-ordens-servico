name: api-ordens-servico

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      # Checa por TCP: durante a inicialização o servidor temporário só aceita conexões locais por socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis do cache e da fila, sem porta exposta. Grava em disco (AOF) para não perder jobs
  # da fila num reinício; o volume é apagado junto com os dados no `down -v`.
  cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://cache:6379
      CACHE_TTL_SEGUNDOS: ${CACHE_TTL_SEGUNDOS:-60}
      FILA_TENTATIVAS: ${FILA_TENTATIVAS:-3}
      FILA_ATRASO_MS: ${FILA_ATRASO_MS:-1000}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # A API só abre a porta depois de aplicar as migrations: porta aceitando conexão = API pronta.
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  # Consome a fila de conclusões. Mesma imagem da API, outro comando. Espera a API ficar
  # saudável porque é ela que aplica as migrations.
  worker:
    build:
      context: .
      target: runtime
    command: ["node", "src/worker.js"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://cache:6379
      FILA_FALHAS_SIMULADAS: ${FILA_FALHAS_SIMULADAS:-0}
    depends_on:
      api:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados-postgres:
  dados-redis:
